[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-lab"
version = "0.1.0"
description = "Reproducible comparison of document retrieval methods"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
semantic = ["numpy>=1.24,<3", "onnxruntime>=1.18,<2", "tokenizers>=0.19,<1"]

[project.scripts]
semantic-search = "semantic_search.cli:main"

[tool.setuptools.packages.find]
include = ["semantic_search"]

[tool.setuptools.package-data]
semantic_search = ["data/*.jsonl"]
